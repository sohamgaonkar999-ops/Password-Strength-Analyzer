<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password Security Checker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            width: 750px;
            background: #ffffff;
            color: #222;
            border-radius: 18px;
            padding: 35px;
            display: flex;
            gap: 35px;
            box-shadow: 0 10px 30px #00000066;
        }

        .left {
            width: 55%;
        }

        .right {
            width: 45%;
            background: #f3f5ff;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #243b55;
        }

        .small {
            color: #777;
        }

        .field {
            position: relative;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px 70px 14px 14px;
            box-sizing: border-box;
            margin-top: 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            margin-top: 0;
            padding: 5px 8px;
            font-size: 14px;
            font-weight: bold;
            color: #243b55;
        }

        .toggle:hover {
            background: none;
            color: #141e30;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .score {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #243b55;
            color: white;
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        ul {
            text-align: left;
            padding-left: 20px;
            line-height: 2;
        }

        .good {
            color: green;
        }

        .bad {
            color: #e63946;
        }
    </style>
</head>

<body>

<div class="main">

    <div class="left">

        <h1>🔐 Password Security</h1>

        <p class="small">
            Test your password before using it.
        </p>

        <div class="field">
            <input type="password" id="password"
                   placeholder="Type your password">
            <button type="button" class="toggle"
                    onclick="togglePassword()" id="eye">Show</button>
        </div>

        <button onclick="analyze()">Analyze Password</button>

        <h3 id="message"></h3>

        <ul id="checks">
            <li>Minimum 8 characters</li>
            <li>Uppercase letter</li>
            <li>Lowercase letter</li>
            <li>Number</li>
            <li>Special character</li>
        </ul>

    </div>


    <div class="right">

        <h2>Security Score</h2>

        <div class="score" id="score">0/5</div>

        <p id="advice">
            Enter a password to begin.
        </p>

    </div>

</div>


<script>

function togglePassword() {

    let input = document.getElementById("password");
    let eye = document.getElementById("eye");

    if (input.type == "password") {
        input.type = "text";
        eye.innerHTML = "Hide";
    } else {
        input.type = "password";
        eye.innerHTML = "Show";
    }
}

function analyze() {

    let p = document.getElementById("password").value;
    let score = 0;

    let checks = document.getElementById("checks");

    if (p.length >= 8) score++;
    if (/[A-Z]/.test(p)) score++;
    if (/[a-z]/.test(p)) score++;
    if (/[0-9]/.test(p)) score++;
    if (/[^A-Za-z0-9]/.test(p)) score++;

    document.getElementById("score").innerHTML = score + "/5";

    if (p == "") {
        document.getElementById("message").innerHTML =
            "Please enter a password";
        document.getElementById("advice").innerHTML =
            "Nothing to check yet.";
        return;
    }

    if (score <= 2) {

        document.getElementById("message").innerHTML =
            "Weak Password";
        document.getElementById("message").className = "bad";

        document.getElementById("advice").innerHTML =
            "Add more characters, numbers and symbols.";

    } else if (score <= 4) {

        document.getElementById("message").innerHTML =
            "Medium Password";
        document.getElementById("message").className = "";

        document.getElementById("advice").innerHTML =
            "Almost there. Add one more security feature.";

    } else {

        document.getElementById("message").innerHTML =
            "Strong Password";
        document.getElementById("message").className = "good";

        document.getElementById("advice").innerHTML =
            "Excellent! Your password meets all checks.";

    }
}

</script>

</body>
</html>
